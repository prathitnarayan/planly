name: planly-cron
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Planly
        run: |
          curl -fsS --max-time 120 -X POST "${{ secrets.PLANLY_API_URL }}/cron/notify" \
               -H "X-Cron-Secret: ${{ secrets.PLANLY_CRON_SECRET }}"
